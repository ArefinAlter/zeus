[package]
name = "zeus-app-agent"
description = "The Zeus app's in-app agent: BYOK providers, keys and the tool loop."
version = "0.0.1-beta.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/ArefinAlter/zeus"
authors = ["Zeus contributors"]
publish = false

[dependencies]
zeus-app = { path = "../zeus-app" }
zeus-api.workspace = true
zeus-types.workspace = true
zeus-mcp = { path = "../../../../../crates/zeus-mcp" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
hex.workspace = true
sha2.workspace = true
rand.workspace = true
tokio-util = { version = "0.7", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream", "system-proxy"] }
keyring = "4.2"
zeroize = { version = "1.9", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
