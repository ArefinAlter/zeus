[package]
name = "zeus-app-index"
description = "The Zeus app's file index (scan, watcher, search, preview, bookmarks, history)."
version = "0.0.1-beta"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/ArefinAlter/zeus"
authors = ["Zeus contributors"]
publish = false

[dependencies]
zeus-app = { path = "../zeus-app" }
zeus-api.workspace = true
zeus-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
hex.workspace = true
sha2.workspace = true
notify = { version = "8", default-features = false }
base64 = "0.23"
trash = "5"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
