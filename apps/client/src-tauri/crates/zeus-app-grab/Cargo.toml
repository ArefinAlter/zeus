[package]
name = "zeus-app-grab"
description = "The Zeus app's link grabber checks and site grabber crawler."
version = "0.0.1-beta.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/ArefinAlter/zeus"
authors = ["Zeus contributors"]
publish = false

[dependencies]
zeus-app = { path = "../zeus-app" }
zeus-api.workspace = true
zeus-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
hex.workspace = true
sha2.workspace = true
reqwest.workspace = true

[dev-dependencies]
tempfile = "3.27"
axum.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
