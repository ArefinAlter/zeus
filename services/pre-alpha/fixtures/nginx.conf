# The fixture file server: the only place hosted downloads can come from. It runs on the internal network with no
# route out; zeusd reaches it as files.example.org, mirror.example.net and docs.example.org (network aliases).
worker_processes 2;
pid /tmp/nginx.pid;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Half of the requests to /flaky/ are busy (503 with Retry-After), the rest succeed.
    split_clients "${request_id}" $flaky_busy {
        50% 1;
        * 0;
    }

    server {
        listen 80 default_server;
        server_name files.example.org mirror.example.net;
        root /srv/files.example.org;
        autoindex on;
        etag on;

        location /slow/ { limit_rate 512k; }
        location /no-range/ { max_ranges 0; etag off; add_header Accept-Ranges none always; }
        location /flaky/ {
            if ($flaky_busy) { add_header Retry-After 10 always; return 503; }
        }
        location /expired/ { return 403 "This signed link has expired.\n"; }
        location /gone/ { return 410 "This file was removed.\n"; }
        location /broken/ { return 500 "Internal server error.\n"; }
    }

    server {
        listen 80;
        server_name docs.example.org;
        root /srv/docs.example.org;
        index index.html;
        etag on;
    }
}
