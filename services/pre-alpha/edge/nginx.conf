# The front of the hosted pre-alpha (one origin): the client's static files, /api/ to zeus-web-bridge, and /svc/ to
# the pre-alpha service after the bridge has authenticated the visitor's session (auth_request). The host's nginx
# terminates TLS, rate-limits and adds security headers in front of this.
worker_processes 2;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The desktop app's own origins may call the API (bearer token, no cookies).
    map $http_origin $cors_origin {
        default "";
        "tauri://localhost" $http_origin;
        "http://tauri.localhost" $http_origin;
        "https://tauri.localhost" $http_origin;
    }

    server {
        listen 8080;
        client_max_body_size 600k;
        root /usr/share/nginx/html;

        set $bridge http://bridge:8080;
        set $svc http://svc:8081;

        # The session check is for this proxy only.
        location = /api/v1/auth { return 404; }

        location /api/ {
            proxy_pass $bridge;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Zeus-Session "";
            proxy_read_timeout 30s;
        }

        location = /_auth {
            internal;
            proxy_pass $bridge/api/v1/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
        }

        location /svc/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "authorization, content-type, x-zeus-client" always;
                add_header Access-Control-Max-Age 600 always;
                add_header Vary Origin always;
                return 204;
            }
            auth_request /_auth;
            auth_request_set $zeus_session $upstream_http_x_zeus_session;
            proxy_pass $svc;
            proxy_http_version 1.1;
            proxy_set_header X-Zeus-Session $zeus_session;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_read_timeout 60s;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Vary Origin always;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        }

        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
        }
    }
}
