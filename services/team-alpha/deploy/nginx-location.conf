# Include in the dedicated HTTPS server whose server_name equals config.origin.
# Keep TLS/certificate configuration in the machine's existing nginx owner workflow.
# No access/error log may record the OIDC code/state/user_code query or Authorization/Cookie.
location / {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:18560;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_send_timeout 25s;
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_hide_header X-Powered-By;
    access_log off;
    error_log /dev/null crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
