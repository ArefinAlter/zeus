[package]
name = "zeus-cloud"
description = "Bounded cloud delivery providers with explicit capabilities and private recovery checkpoints"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
os-keyring = ["dep:keyring"]
# Hermetic subprocess fixture; never enabled by normal builds.
test-fixtures = []

[[bin]]
name = "zeus-cloud-rclone-fixture"
path = "tests/support/rclone_fixture.rs"
required-features = ["test-fixtures"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
rand.workspace = true
bytes.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["form", "query"] }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
zeroize.workspace = true
sha2.workspace = true
md-5.workspace = true
hex.workspace = true
keyring = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
axum.workspace = true

[lints]
workspace = true
