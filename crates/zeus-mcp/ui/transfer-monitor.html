<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-9sq3baJ8ucZj5/Bvrlj9e/XXso41ruIBGlny+JhuLuo='; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Zeus transfer monitor</title>
<style>
:root{color-scheme:light dark;font-family:var(--font-sans,system-ui,sans-serif);color:var(--color-text-primary,#e8eaed);background:var(--color-background-primary,#141719);font-size:14px}*{box-sizing:border-box}body{margin:0;padding:20px}header{display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;border:1px solid #71958b;border-radius:10px;display:grid;place-items:center;color:#a7d4c2;font-weight:800;font-size:20px}h1{font-size:18px;margin:0;letter-spacing:-.3px}p{color:var(--color-text-secondary,#9ca8ae);line-height:1.5}.sub{margin:3px 0 0;font-size:12px}.refresh{margin-left:auto;border:1px solid var(--color-border-primary,#414b4f);border-radius:8px;background:transparent;color:inherit;padding:8px 12px;font:inherit;cursor:pointer}.refresh:disabled{opacity:.45;cursor:default}.refresh:focus-visible{outline:2px solid #9acbb8;outline-offset:3px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:20px 0 16px}.stat{padding:12px;border:1px solid var(--color-border-secondary,#313b3f);border-radius:10px}.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.stat span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-top:5px;color:var(--color-text-secondary,#a4afb4)}.table-wrap{max-height:340px;overflow:auto;border:1px solid var(--color-border-secondary,#313b3f);border-radius:10px}table{width:100%;border-collapse:collapse;table-layout:fixed}th{position:sticky;top:0;text-align:left;background:var(--color-background-secondary,#20272a);font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--color-text-secondary,#a4afb4)}td,th{padding:11px 12px;border-bottom:1px solid var(--color-border-secondary,#313b3f)}th:first-child{width:46%}td{vertical-align:top;overflow-wrap:anywhere;font-size:12px}tr:last-child td{border-bottom:0}.name{font-weight:600}.detail{font-size:11px;color:var(--color-text-secondary,#9ca8ae);margin-top:5px}.bar{height:4px;background:#34423f;border-radius:5px;margin-top:7px;overflow:hidden}.fill{height:100%;background:#8ac5ae;width:0}.state{display:inline-block;padding:3px 6px;border:1px solid #42534d;border-radius:5px;line-height:1.3}.state[data-state="completed"]{color:#a7d4c2}.state[data-state="failed"],.state[data-state="awaiting_approval"]{color:#edbf95;border-color:#735640}.empty{padding:28px 12px;text-align:center}footer{font-size:11px;margin-top:12px;color:var(--color-text-secondary,#9ca8ae);line-height:1.5}#status{min-height:18px;font-size:12px;margin:12px 0}html[data-theme="light"]{--color-text-secondary:#52635c;--color-border-primary:#a8b9af;--color-border-secondary:#bdccc3;color-scheme:light;background:var(--color-background-primary,#fafbf9);color:var(--color-text-primary,#1b2623)}html[data-theme="light"] .state{color:#386655}html[data-theme="light"] .mark{color:#386655}html[data-theme="light"] th{background:var(--color-background-secondary,#eef2ee)}@media(max-width:380px){body{padding:12px}h1{font-size:16px}td,th{padding:9px 7px}.summary{gap:6px}.stat{padding:10px}.state{font-size:11px;overflow-wrap:normal}th:first-child{width:42%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header><span class="mark" aria-hidden="true">Z</span><div><h1>Transfer monitor</h1><p class="sub">Zeus · current transfer state</p></div><button class="refresh" id="refresh" type="button" disabled>Refresh</button></header>
<div class="summary" aria-label="Visible transfer totals"><div class="stat"><b id="active">0</b><span>Active</span></div><div class="stat"><b id="finished">0</b><span>Completed</span></div><div class="stat"><b id="rate">0 B/s</b><span>Current rate</span></div></div>
<div id="status" role="status" aria-live="polite">Connecting to the MCP host…</div>
<div class="table-wrap" tabindex="0" aria-label="Visible transfers"><table><thead><tr><th scope="col">File</th><th scope="col">State</th><th scope="col">Progress</th></tr></thead><tbody id="rows"><tr><td colspan="3" class="empty">Waiting for transfer results.</td></tr></tbody></table></div>
<footer>View only. Open Zeus to review requests or change transfers. This monitor makes no external network connections.</footer>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),pending=new Map();let next=1,ready=false,stopped=false,observer;
const text=(value,limit=180)=>typeof value==='string'?value.slice(0,limit):'';
const number=value=>Number.isSafeInteger(value)&&value>=0?value:0;
const bytes=value=>{let n=number(value),unit=0;while(n>=1024&&unit<4){n/=1024;unit++}return `${n.toFixed(unit?1:0)} ${['B','KiB','MiB','GiB','TiB'][unit]}`};
function notify(method,params={}){if(!stopped)window.parent.postMessage({jsonrpc:'2.0',method,params},'*')}
function request(method,params){return new Promise((resolve,reject)=>{if(stopped||pending.size>=8){reject(Error('Monitor is unavailable'));return}const id=next++,timer=setTimeout(()=>{pending.delete(id);reject(Error('The host did not respond'))},10000);pending.set(id,{resolve,reject,timer});window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*')})}
function context(value){if(!value||typeof value!=='object')return;if(value.theme==='light'||value.theme==='dark')document.documentElement.dataset.theme=value.theme;const vars=value.styles?.variables;if(vars&&typeof vars==='object')for(const key of ['--color-background-primary','--color-background-secondary','--color-text-primary','--color-text-secondary','--color-border-primary','--color-border-secondary','--font-sans']){const v=vars[key];if(typeof v==='string'&&v.length<=160&&!/[;{}<>]/.test(v))document.documentElement.style.setProperty(key,v)}}
function render(result){const data=result?.structuredContent;if(!data||typeof data!=='object'||!Array.isArray(data.jobs)){if(result?.isError)$('status').textContent='Zeus could not return these transfers. Open Zeus for details.';return}const jobs=data.jobs.slice(0,100),body=$('rows');body.replaceChildren();let active=0,finished=0,rate=0;for(const job of jobs){if(!job||typeof job!=='object')continue;const state=text(job.state,40),done=number(job.bytes_done),total=number(job.bytes_total),speed=number(job.rate_bps);if(['queued','probing','downloading','verifying','finalizing'].includes(state))active++;if(state==='completed')finished++;rate=Math.min(Number.MAX_SAFE_INTEGER,rate+speed);const row=document.createElement('tr'),file=document.createElement('td'),status=document.createElement('td'),progress=document.createElement('td'),name=document.createElement('div'),identity=document.createElement('div'),badge=document.createElement('span');name.className='name';name.textContent=text(job.untrusted_filename)||text(job.job_id,60)||'Unnamed transfer';identity.className='detail';identity.textContent=text(job.job_id,60);file.append(name,identity);badge.className='state';badge.dataset.state=state;badge.textContent=state.replaceAll('_',' ')||'unknown';status.append(badge);progress.textContent=total?`${bytes(done)} / ${bytes(total)}`:bytes(done);const detail=document.createElement('div');detail.className='detail';detail.textContent=speed?`${bytes(speed)}/s`:job.quarantined?'Quarantined':'';progress.append(detail);if(total){const bar=document.createElement('div'),fill=document.createElement('div');bar.className='bar';fill.className='fill';fill.style.width=`${Math.max(0,Math.min(100,done/total*100))}%`;bar.append(fill);progress.append(bar)}row.append(file,status,progress);body.append(row)}if(!body.children.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=3;cell.className='empty';cell.textContent='No transfers in this result.';row.append(cell);body.append(row)}$('active').textContent=String(active);$('finished').textContent=String(finished);$('rate').textContent=`${bytes(rate)}/s`;$('status').textContent=`${jobs.length} visible transfer${jobs.length===1?'':'s'} · updated ${new Date().toLocaleTimeString()}`}
async function refresh(){if(!ready||stopped)return;$('refresh').disabled=true;try{render(await request('tools/call',{name:'zeus_status',arguments:{limit:50}}))}catch{$('status').textContent='The monitor could not refresh. Open Zeus to check the connection.'}finally{if(!stopped)$('refresh').disabled=false}}
function cleanup(){stopped=true;ready=false;$('refresh').disabled=true;observer?.disconnect();window.removeEventListener('message',receive);for(const p of pending.values()){clearTimeout(p.timer);p.reject(Error('Monitor closed'))}pending.clear()}
function receive(event){if(event.source!==window.parent||!event.data||typeof event.data!=='object')return;const message=event.data;try{if(JSON.stringify(message).length>131072)return}catch{return}if(message.jsonrpc!=='2.0')return;if(message.id!==undefined&&pending.has(message.id)&&('result'in message||'error'in message)){const p=pending.get(message.id);pending.delete(message.id);clearTimeout(p.timer);message.error?p.reject(Error('Host request failed')):p.resolve(message.result);return}if(message.method==='ui/notifications/tool-result')render(message.params);else if(message.method==='ui/notifications/host-context-changed')context(message.params);else if(message.method==='ui/notifications/tool-cancelled')$('status').textContent='The tool request was canceled.';else if(message.method==='ping'&&message.id!==undefined)window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');else if(message.method==='ui/resource-teardown'&&message.id!==undefined){window.parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');cleanup()}}
$('refresh').addEventListener('click',refresh);window.addEventListener('message',receive);if(window.parent===window){$('status').textContent='Open this monitor in an MCP host.';return}
request('ui/initialize',{appInfo:{name:'Zeus transfer monitor',version:'0.1.0-alpha.1'},appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'}).then(result=>{if(stopped)return;if(result?.protocolVersion!=='2026-01-26')throw Error('Unsupported host version');context(result.hostContext);ready=!!result.hostCapabilities?.serverTools;notify('ui/notifications/initialized');$('refresh').disabled=!ready;$('status').textContent=ready?'Ready. Transfer results appear here.':'Waiting for transfer results from the host.';if(typeof ResizeObserver!=='undefined'){observer=new ResizeObserver(()=>notify('ui/notifications/size-changed',{width:Math.ceil(document.documentElement.scrollWidth),height:Math.ceil(document.documentElement.scrollHeight)}));observer.observe(document.body)}}).catch(()=>{$('status').textContent='The host could not initialize this monitor.'});
})();
</script></body></html>
