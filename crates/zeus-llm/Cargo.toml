[package]
name = "zeus-llm"
description = "Zeus LLM provider ladder, signed policy manifest, OpenRouter PKCE helper, keyring abstraction and spend accounting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Wire types only by default; the daemon enables the network and keyring backends.
default = []
http = ["dep:reqwest"]
os-keyring = ["dep:keyring"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
async-trait.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true
zeroize.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
time.workspace = true
tracing.workspace = true
reqwest = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
