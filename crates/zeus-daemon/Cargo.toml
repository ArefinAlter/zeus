[package]
name = "zeus-daemon"
description = "zeusd: the Zeus daemon that owns jobs, sessions, approvals and the local API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "zeus_daemon"
path = "src/lib.rs"

[[bin]]
name = "zeusd"
path = "src/main.rs"

[features]
default = []
# Phase 2: the A2A task mapping inside the daemon (the HTTP endpoint is a separate bridge process).
a2a = ["dep:zeus-a2a"]

[dependencies]
zeus-api.workspace = true
zeus-cloud = { workspace = true, features = ["os-keyring"] }
tokio-util = { workspace = true, features = ["io"] }
ulid.workspace = true
zeus-workflow = { workspace = true, features = ["runtime"] }
zeus-llm = { workspace = true, features = ["http", "os-keyring"] }
zeus-a2a = { workspace = true, optional = true }
# core:begin
zeus-types.workspace = true
zeus-control.workspace = true
zeus-fs.workspace = true
zeus-verify.workspace = true
zeus-journal.workspace = true
zeus-session.workspace = true
zeus-http.workspace = true
zeus-engine.workspace = true
# core:end
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
directories.workspace = true
blake3.workspace = true
md-5.workspace = true
hex.workspace = true
redb.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
zeus-artifact.workspace = true
zeroize.workspace = true
time.workspace = true

reqwest.workspace = true
http.workspace = true
bytes.workspace = true
url.workspace = true
regex.workspace = true

schemars.workspace = true

[dev-dependencies]
zeus-types = { workspace = true, features = ["spec-testing"] }
tempfile.workspace = true
proptest.workspace = true
assert_cmd.workspace = true
tokio = { workspace = true, features = ["test-util"] }
