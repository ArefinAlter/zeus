[package]
name = "zeus-cli"
description = "The zeus command line interface and terminal UI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["mcp-http"]
mcp-http = ["zeus-mcp/http"]

[lib]
name = "zeus_cli"
path = "src/lib.rs"

[[bin]]
name = "zeus"
path = "src/main.rs"

[dependencies]
base64.workspace = true
zeus-api.workspace = true
zeus-a2a-bridge.workspace = true
zeus-mcp.workspace = true
zeus-llm.workspace = true
zeus-workflow.workspace = true
# core:begin
zeus-types.workspace = true
zeus-verify.workspace = true
# core:end
clap.workspace = true
clap_complete.workspace = true
ratatui.workspace = true
crossterm.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonschema.workspace = true
toml.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
which.workspace = true
zeus-native-host.workspace = true
ulid.workspace = true
blake3.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
async-trait.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
insta.workspace = true
tempfile.workspace = true
proptest.workspace = true
