# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Run: cargo deny check

[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Each ignore names why the advisory cannot reach Zeus. Review them whenever a fixed release appears.
ignore = [
    # `zbus_names`, `zvariant`, `zvariant_derive` are unmaintained (merged into zbus 6), not vulnerable.
    # They arrive through the Linux secret-service backend of `keyring`; drop these when keyring moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained, no vulnerability; via keyring's Linux backend" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained, no vulnerability; via keyring's Linux backend" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained, no vulnerability; via keyring's Linux backend" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # TLS goes through rustls only. Adding OpenSSL or native-tls is a deliberate decision.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/ikatson/librqbit-utp"]
