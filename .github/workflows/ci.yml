# Required checks for the zeus app workspace. The workspace builds against the sibling zeus-core checkout
# (path dependencies), so every Rust job checks it out next to this repository: the branch with the same
# name when it exists, otherwise the compatible revision pinned below, or an explicit ref for a manual run.
#
# zeus-core is private: ZEUS_CORE_SSH_KEY is the private half of a read-only deploy key
# attached only to ArefinAlter/zeus-core. Fork pull requests do not receive it and cannot build.
# See docs/CI_ACCESS.md for setup, verification and rotation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      core_ref:
        description: zeus-core branch, tag or commit (default the same branch name, else the pinned compatible revision)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  core-ref:
    name: Resolve zeus-core ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      # This job runs only the inline ref lookup. Checkout removes its temporary key at job exit.
      - name: Authenticate private core ref lookup
        uses: actions/checkout@v5
        with:
          repository: ArefinAlter/zeus-core
          ref: 0d2f586a94a2356f79febd19a1a3215f81b03809
          ssh-key: ${{ secrets.ZEUS_CORE_SSH_KEY }}
          ssh-strict: true
          persist-credentials: true
          path: core-ref
          sparse-checkout: /Cargo.toml
          sparse-checkout-cone-mode: false
      - id: resolve
        working-directory: core-ref
        shell: bash
        env:
          REQUESTED: ${{ inputs.core_ref }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          ref="${REQUESTED:-}"
          if [ -z "$ref" ]; then
            if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null; then
              ref="$BRANCH"
            else
              lookup_status=$?
              if [ "$lookup_status" -ne 2 ]; then
                echo "::error::Cannot read private zeus-core refs; check CI deploy-key access."
                exit "$lookup_status"
              fi
              ref="0d2f586a94a2356f79febd19a1a3215f81b03809"
            fi
          fi
          echo "zeus-core ref: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (${{ matrix.os }})
    needs: core-ref
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: zeus
      - uses: actions/checkout@v5
        with:
          repository: ArefinAlter/zeus-core
          ref: ${{ needs.core-ref.outputs.ref }}
          ssh-key: ${{ secrets.ZEUS_CORE_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          path: zeus-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeus
      - name: Format
        if: runner.os == 'Linux'
        working-directory: zeus
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: zeus
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        working-directory: zeus
        run: cargo test --workspace --all-features --locked
      - name: Generated API schema is current
        working-directory: zeus
        run: cargo test -p zeus-api --all-features --locked schema

  msrv:
    name: MSRV 1.90
    needs: core-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: zeus
      - uses: actions/checkout@v5
        with:
          repository: ArefinAlter/zeus-core
          ref: ${{ needs.core-ref.outputs.ref }}
          ssh-key: ${{ secrets.ZEUS_CORE_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          path: zeus-core
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeus
          key: msrv
      - name: Check with the declared minimum toolchain
        working-directory: zeus
        # The checked-in rust-toolchain.toml selects stable; the override pins the MSRV for this job.
        run: cargo +1.90.0 check --workspace --all-features --locked

  contracts:
    name: Specs and contracts
    needs: core-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: zeus
      - uses: actions/checkout@v5
        with:
          repository: ArefinAlter/zeus-core
          ref: ${{ needs.core-ref.outputs.ref }}
          ssh-key: ${{ secrets.ZEUS_CORE_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          path: zeus-core
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zeus/docs/spec/tools/package-lock.json
      - name: Validate every normative example
        working-directory: zeus/docs/spec/tools
        run: |
          npm ci
          npm run validate
      - name: Cloud schema and MCP catalogue are current
        working-directory: zeus
        run: |
          node docs/spec/tools/sync-cloud-schema.mjs --check
          node docs/spec/tools/mcp-catalogue.mjs --check
      - name: zeus-core fixtures match these specs
        working-directory: zeus-core
        run: node scripts/sync-spec-fixtures.mjs --check ../zeus

  deny:
    name: Dependencies, licenses and advisories
    needs: core-ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: zeus
      - uses: actions/checkout@v5
        with:
          repository: ArefinAlter/zeus-core
          ref: ${{ needs.core-ref.outputs.ref }}
          ssh-key: ${{ secrets.ZEUS_CORE_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          path: zeus-core
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: zeus/Cargo.toml
          command: check

  # The independent desktop workspace keeps GUI dependencies out of daemon jobs.
  # macOS remains informational until installed-client and platform acceptance is complete.
  desktop:
    name: Desktop (${{ matrix.os }})
    needs: core-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            informational: false
          - os: macos-15
            informational: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.informational }}
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@v5
        with:
          path: zeus
      - uses: actions/checkout@v5
        with:
          repository: ArefinAlter/zeus-core
          ref: ${{ needs.core-ref.outputs.ref }}
          ssh-key: ${{ secrets.ZEUS_CORE_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          path: zeus-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeus/apps/desktop
          key: desktop
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Desktop formatting
        working-directory: zeus
        run: cargo fmt --manifest-path apps/desktop/Cargo.toml --all --check
      - name: Headless bridge tests
        working-directory: zeus
        run: cargo test --manifest-path apps/desktop/Cargo.toml --no-default-features --locked
      - name: Build bundled desktop executable
        working-directory: zeus
        run: cargo build --manifest-path apps/desktop/Cargo.toml --locked
      - name: Desktop Clippy
        working-directory: zeus
        run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets --locked -- -D warnings
      - name: Frontend model tests
        working-directory: zeus
        run: node --test apps/desktop/tests/model.test.mjs

  # The pre-alpha client (apps/client): a web frontend on a scripted backend, with no daemon and no zeus-core build.
  # Its Tauri shell is an independent Cargo workspace and is built locally, not in this job.
  client:
    name: Client (typecheck, model tests, web builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Install
        working-directory: apps/client
        run: npm ci
      - name: Typecheck, test and build
        working-directory: apps/client
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run build:site

  # Build/test evidence is separate from installed-platform, browser, keyring and GUI acceptance.
  # Keep new CPU/OS combinations informational until their failures and missing capabilities are resolved.
  compatibility:
    name: Rust (${{ matrix.target }}, informational)
    needs: core-ref
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@v5
        with:
          path: zeus
      - name: Protect Windows checkout temp key inheritance
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./zeus/.github/scripts/protect-runner-temp.ps1 -Path $env:RUNNER_TEMP
      - uses: actions/checkout@v5
        with:
          repository: ArefinAlter/zeus-core
          ref: ${{ needs.core-ref.outputs.ref }}
          ssh-key: ${{ secrets.ZEUS_CORE_SSH_KEY }}
          ssh-strict: true
          persist-credentials: false
          path: zeus-core
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zeus
      - name: Record compiler host
        run: rustc -vV
      - name: Test on the requested CPU architecture
        working-directory: zeus
        run: cargo test --workspace --all-features --locked --target ${{ matrix.target }}
